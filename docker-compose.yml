services:
  namenode:
    image: apache/hadoop:3
    container_name: namenode
    hostname: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
      - "8020:8020"
    volumes:
      - namenode:/opt/hadoop/dfs/name
      - ./config:/opt/hadoop/etc/hadoop:ro
    environment:
      - ENSURE_NAMENODE_DIR=/opt/hadoop/dfs/name
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    user: root
    networks:
      - hadoop
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      bash -c "
        if [ ! -d /opt/hadoop/dfs/name/current ]; then
          echo 'Formatting NameNode...';
          hdfs namenode -format -force -nonInteractive;
        fi;
        hdfs namenode
      "

  datanode:
    image: apache/hadoop:3
    container_name: datanode
    hostname: datanode
    ports:
      - "9864:9864"
    volumes:
      - datanode:/opt/hadoop/dfs/data
      - ./config:/opt/hadoop/etc/hadoop:ro
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    user: root
    networks:
      - hadoop
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9864/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: hdfs datanode

  resourcemanager:
    image: apache/hadoop:3
    container_name: resourcemanager
    hostname: resourcemanager
    ports:
      - "8088:8088"
    volumes:
      - ./config:/opt/hadoop/etc/hadoop:ro
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    networks:
      - hadoop
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: yarn resourcemanager

  nodemanager:
    image: apache/hadoop:3
    container_name: nodemanager
    hostname: nodemanager
    ports:
      - "8042:8042"
    volumes:
      - ./config:/opt/hadoop/etc/hadoop:ro
      - nodemanager_local:/tmp/hadoop-root
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    networks:
      - hadoop
    depends_on:
      resourcemanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8042/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: yarn nodemanager

  historyserver:
    image: apache/hadoop:3
    container_name: historyserver
    hostname: historyserver
    ports:
      - "19888:19888"
    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline
      - ./config:/opt/hadoop/etc/hadoop:ro
      - hadoop_history_logs:/opt/hadoop/logs
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    user: root
    networks:
      - hadoop
    depends_on:
      resourcemanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19888/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      bash -c "
        mkdir -p /hadoop/yarn/timeline /opt/hadoop/logs;
        mapred historyserver
      "

volumes:
  namenode:
  datanode:
  nodemanager_local:
  hadoop_historyserver:
  hadoop_history_logs:

networks:
  hadoop:
    driver: bridge
    name: hadoop