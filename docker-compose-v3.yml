version: '3.8'

services:
  namenode:
    build: ./namenode
    image: hadoop-namenode:3.3.6
    container_name: namenode
    restart: unless-stopped
    ports:
      - "9870:9870"
      - "9000:9000"
      - "8020:8020"
    volumes:
      - namenode:/hadoop/dfs/name
      - ./config:/etc/hadoop
    environment:
      - CLUSTER_NAME=hadoop-cluster
    env_file:
      - ./hadoop.env
    networks:
      - hadoop

  datanode:
    build: ./datanode
    image: hadoop-datanode:3.3.6
    container_name: datanode
    restart: unless-stopped
    ports:
      - "9864:9864"
    volumes:
      - datanode:/hadoop/dfs/data
      - ./config:/etc/hadoop
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - ./hadoop.env
    depends_on:
      - namenode
    networks:
      - hadoop

  resourcemanager:
    build: ./resourcemanager
    image: hadoop-resourcemanager:3.3.6
    container_name: resourcemanager
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - ./config:/etc/hadoop
    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864"
    env_file:
      - ./hadoop.env
    depends_on:
      - namenode
      - datanode
    networks:
      - hadoop

  nodemanager:
    build: ./nodemanager
    image: hadoop-nodemanager:3.3.6
    container_name: nodemanager
    restart: unless-stopped
    ports:
      - "8042:8042"
    volumes:
      - ./config:/etc/hadoop
    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864 resourcemanager:8088"
    env_file:
      - ./hadoop.env
    depends_on:
      - namenode
      - datanode
      - resourcemanager
    networks:
      - hadoop

  historyserver:
    build: ./historyserver
    image: hadoop-historyserver:3.3.6
    container_name: historyserver
    restart: unless-stopped
    ports:
      - "19888:19888"
    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline
      - ./config:/etc/hadoop
    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864 resourcemanager:8088"
    env_file:
      - ./hadoop.env
    depends_on:
      - namenode
      - datanode
      - resourcemanager
    networks:
      - hadoop

volumes:
  namenode:
  datanode:
  hadoop_historyserver:

networks:
  hadoop:
    driver: bridge